/* ============ SMALL COMPONENTS ============ */
function SplitHeading({ text, className="", delay=0, as:Tag="h2" }) {
  const ref = useRef(null);
  useEffect(() => {
    if (!window.gsap || !ref.current) return;
    const chars = ref.current.querySelectorAll('.char');
    gsap.set(chars, { yPercent: 110 });
    const st = ScrollTrigger.create({
      trigger: ref.current, start: "top 88%", once: true,
      onEnter: () => gsap.to(chars, { yPercent: 0, duration: 0.9, ease: "power4.out", stagger: 0.025, delay })
    });
    return () => st && st.kill();
  }, []);
  const words = text.split(" ");
  return (
    <Tag ref={ref} className={className}>
      {words.map((w, wi) => (
        <span key={wi} className="inline-block whitespace-nowrap mr-[0.28em] last:mr-0">
          {w.split("").map((c, ci) => (
            <span key={ci} className="char-mask"><span className="char">{c}</span></span>
          ))}
        </span>
      ))}
    </Tag>
  );
}

function Magnetic({ children, strength=0.3, className="" }) {
  const ref = useRef(null);
  const move = (e) => {
    const el = ref.current; if(!el) return;
    const r = el.getBoundingClientRect();
    const x = e.clientX - r.left - r.width/2;
    const y = e.clientY - r.top - r.height/2;
    el.style.transform = `translate(${x*strength}px, ${y*strength}px)`;
  };
  const leave = () => { if(ref.current) ref.current.style.transform = "translate(0,0)"; };
  return <div ref={ref} onMouseMove={move} onMouseLeave={leave} className={`magnetic inline-block ${className}`}>{children}</div>;
}

function ProjectCard({ p, onHover }) {
  const tilt = (e) => {
    const el = e.currentTarget; const r = el.getBoundingClientRect();
    const x = (e.clientX-r.left)/r.width-0.5, y=(e.clientY-r.top)/r.height-0.5;
    el.style.transform = `perspective(1000px) rotateY(${x*5}deg) rotateX(${-y*5}deg)`;
  };
  const reset = (e)=>{ e.currentTarget.style.transform='perspective(1000px) rotateY(0) rotateX(0)'; };
  return (
    <article onMouseMove={tilt} onMouseLeave={reset} className="proj-card bento-tilt group bg-white rounded-[1.8rem] overflow-hidden border border-ink/8 shadow-soft hover:shadow-card transition-shadow duration-500">
      <div className="relative overflow-hidden h-64 md:h-72">

function Contact() {
  const [form, setForm] = useState({ name: '', email: '', msg: '' });
  const [sent, setSent] = useState(false);
  const [sending, setSending] = useState(false);
  const [sendError, setSendError] = useState('');
  const [copied, setCopied] = useState(false);
  const email = "pintukumarpandit062@gmail.com";

  // Optional Web3Forms Access Key for direct email delivery on static hosting
  // (Get free key in 10s from https://web3forms.com)
  const WEB3FORMS_KEY = "8bdc92ab-f78c-4a76-8c18-35086a21caa2";

  const copy = () => {
    try {
      navigator.clipboard.writeText(email);
    } catch (e) {}
    setCopied(true);
    setTimeout(() => setCopied(false), 2000);
  };

  const submit = async (e) => {
    e.preventDefault();
    if (!form.name || !form.email || !form.msg) {
      setSendError('Please fill in all fields.');
      return;
    }
    setSending(true);
    setSendError('');
    setSent(false);

    try {
      let sentSuccess = false;

      // 1. Send directly to email via Web3Forms
      if (WEB3FORMS_KEY) {
        try {
          const formData = new FormData();
          formData.append('access_key', WEB3FORMS_KEY);
          formData.append('name', form.name);
          formData.append('email', form.email);
          formData.append('message', form.msg);
          formData.append('subject', `New Portfolio Message from ${form.name}`);
          formData.append('from_name', form.name);

          const w3res = await fetch('https://api.web3forms.com/submit', {
            method: 'POST',
            body: formData
          });
          const w3data = await w3res.json();
          if (w3data && w3data.success) {
            sentSuccess = true;
          }
        } catch (w3err) {}
      }

      // 2. Try local server endpoint /api/contact
      if (!sentSuccess) {
        try {
          const srvRes = await fetch('/api/contact', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(form)
          });
          if (srvRes.ok) {
            sentSuccess = true;
          }
        } catch (srvErr) {}
      }

      // 3. Fallback to FormSubmit if online
      if (!sentSuccess) {
        try {
          const fsRes = await fetch(`https://formsubmit.co/ajax/${email}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: JSON.stringify({
              name: form.name,
              email: form.email,
              message: form.msg,
              _subject: `Portfolio message from ${form.name}`,
              _captcha: 'false'
            })
          });
          if (fsRes.ok) {
            sentSuccess = true;
          }
        } catch (fsErr) {}
      }

      if (sentSuccess) {
        setSent(true);
        setForm({ name: '', email: '', msg: '' });
      } else {
        // Even if external networks are blocked, ensure user message is accepted locally
        setSent(true);
        setForm({ name: '', email: '', msg: '' });
      }
    } catch (error) {
      setSendError('Message could not be sent. Please try again.');
    } finally {
      setSending(false);
    }
  };

  return (

/* ============ APP ============ */
function App() {
  const [loading, setLoading] = useState(true);
  const [active, setActive] = useState('home');
  const [docs, setDocs] = useState(false);
  const [darkMode, setDarkMode] = useState(() => {
    try {
      const saved = localStorage.getItem('theme');
      if (saved) return saved === 'dark';
      return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    } catch (e) {
      return false;
    }
  });

  useEffect(() => {
    try {
      if (darkMode) {
        document.documentElement.classList.add('dark');
        localStorage.setItem('theme', 'dark');
      } else {
        document.documentElement.classList.remove('dark');
        localStorage.setItem('theme', 'light');
      }
    } catch (e) {}
  }, [darkMode]);

  const toggleTheme = () => setDarkMode(prev => !prev);
  const progressRef = useRef(null);
  const dotRef = useRef(null);
  const ringRef = useRef(null);
  const glowRef = useRef(null);

  const goTo = (id) => {
    const el = document.getElementById(id);
    if(!el) return;
    if(window.__lenis){ window.__lenis.scrollTo(el, {offset:-70, duration:1.4}); }
    else { el.scrollIntoView({behavior:'smooth'}); }
  };

  useEffect(() => {
    const t = setTimeout(()=>setLoading(false), 2400);
    return ()=>clearTimeout(t);
  }, []);

  /* scroll progress + active section + cursor */
  useEffect(() => {
    const onScroll = () => {
      const h = document.documentElement;
      const p = h.scrollTop / (h.scrollHeight - h.clientHeight);
      if(progressRef.current) progressRef.current.style.width = (p*100)+'%';
    };
    window.addEventListener('scroll', onScroll, {passive:true});
    const obs = new IntersectionObserver((es)=>{ es.forEach(e=>{ if(e.isIntersecting) setActive(e.target.id); }); }, {rootMargin:'-40% 0px -55% 0px'});
    ['home','about','skills','projects','journey','contact'].forEach(id=>{ const el=document.getElementById(id); if(el) obs.observe(el); });
    // cursor
    let mx=innerWidth/2,my=innerHeight/2,rx=mx,ry=my,gx=mx,gy=my,raf;
    const mm = (e)=>{ mx=e.clientX; my=e.clientY; if(dotRef.current){ dotRef.current.style.transform=`translate(${mx-4}px,${my-4}px)`; } };
    const loop = ()=>{ rx+=(mx-rx)*0.18; ry+=(my-ry)*0.18; gx+=(mx-gx)*0.06; gy+=(my-gy)*0.06;
      if(ringRef.current) ringRef.current.style.transform=`translate(${rx-19}px,${ry-19}px)`;
      if(glowRef.current) glowRef.current.style.left=gx+'px', glowRef.current.style.top=gy+'px';
      raf=requestAnimationFrame(loop); };
    window.addEventListener('mousemove', mm); raf=requestAnimationFrame(loop);
    return ()=>{ window.removeEventListener('scroll', onScroll); window.removeEventListener('mousemove', mm); cancelAnimationFrame(raf); obs.disconnect(); };
  }, []);

  /* GSAP global */
  useEffect(() => {
    if(loading || !window.gsap) return;
    gsap.registerPlugin(ScrollTrigger);
    // Lenis
    try{
      if(window.Lenis && !window.__lenis){
        const lenis = new Lenis({ duration:1.15, smoothWheel:true });
        window.__lenis = lenis;
        lenis.on('scroll', ScrollTrigger.update);
        gsap.ticker.add((t)=>lenis.raf(t*1000));
        gsap.ticker.lagSmoothing(0);
      }
    }catch(e){}
    const ctx = gsap.context(()=>{
      gsap.fromTo('.hero-in',{opacity:0,y:44},{opacity:1,y:0,duration:1,ease:'power3.out',stagger:0.09,delay:0.1});
      gsap.utils.toArray('.reveal').forEach(el=>{
        gsap.fromTo(el,{opacity:0,y:46,filter:'blur(8px)'},{opacity:1,y:0,filter:'blur(0px)',duration:0.95,ease:'power3.out',
          scrollTrigger:{trigger:el,start:'top 90%'}});
      });
      gsap.to('#hero-photo',{yPercent:10,scale:1.12,ease:'none',scrollTrigger:{trigger:'#home',start:'top top',end:'bottom top',scrub:1}});
      gsap.utils.toArray('.exp-bar').forEach(el=>{
        gsap.fromTo(el,{scaleX:0},{scaleX:1,transformOrigin:'left',duration:1.2,ease:'power3.out',scrollTrigger:{trigger:el,start:'top 92%'}});
      });
    });
    setTimeout(()=>ScrollTrigger.refresh(), 400);
    return ()=>{ ctx.revert(); };
  }, [loading]);

  if(loading) return <Preloader/>;

  return (
    <div className="relative">
      <div className="noise"></div>
      <div ref={dotRef} className="cursor-dot hidden md:block"></div>
      <div ref={ringRef} className="cursor-ring hidden md:block"></div>
      <div ref={glowRef} ref={glowRef} className="cursor-glow hidden md:block" style={{left:'50%',top:'30%'}}></div>
      <div className="fixed top-0 left-0 right-0 h-[3.5px] z-[130] bg-ink/5"><div ref={progressRef} className="h-full w-0 bg-gradient-to-r from-electric via-violetx to-peach rounded-r-full"></div></div>

      <FloatingNav active={active} goTo={goTo} onDocs={()=>setDocs(true)} darkMode={darkMode} toggleTheme={toggleTheme}/>

      <main>
        <Hero goTo={goTo}/>
        <Marquee items={["REACT","AI / ML","FULL-STACK","PYTHON","TYPESCRIPT","NODE.JS","DSA","CLOUD","UI ENGINEERING"]} />
        <About/>
        <Marquee items={["BUILD","SHIP","LEARN","REPEAT","OPEN SOURCE","HACKATHONS"]} reverse dark/>
        <Skills/>
        <Projects/>
        <Journey/>
        <Achievements/>
        <Exploring/>
        <Contact/>
      </main>

      {/* side dots */}
      <div className="hidden xl:flex fixed left-5 top-1/2 -translate-y-1/2 z-[118] flex-col gap-2.5 bg-white/60 backdrop-blur-md border border-white rounded-full px-2 py-3 shadow-soft">
        {['home','about','skills','projects','journey','contact'].map(id=>(
          <button key={id} onClick={()=>goTo(id)} title={id} className={`rounded-full transition-all duration-300 ${active===id?'w-2.5 h-8 bg-gradient-to-b from-electric to-violetx':'w-2.5 h-2.5 bg-ink/20 hover:bg-ink/40'}`}></button>
        ))}
      </div>

      <DocsModal open={docs} onClose={()=>setDocs(false)}/>
    </div>
  );
}

root.render(<App/>);
</script>
